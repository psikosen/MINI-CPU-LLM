[pytest]
# Pytest configuration for MINI-CPU-LLM

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=orchestrator/src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for complete flows
    slow: Tests that take a long time to run
    requires_models: Tests that require ML models to be present
    requires_services: Tests that require external services (Ollama, etc.)

# Minimum Python version
minversion = 3.9

# Coverage options
[coverage:run]
source = orchestrator/src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
